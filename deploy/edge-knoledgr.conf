# Knoledgr edge block — APPEND to ~/solakuti/deploy/nginx.conf on the VPS.
#
# Only one process can bind :80/:443, and solakuti's nginx already has them.
# This makes that container the front door for knoledgr.com too, proxying to
# the recall stack's own nginx over the shared `recall_edge` network. The
# solakuti server blocks are not modified.
#
# Apply with:
#   docker network connect recall_edge deploy-nginx-1        # live, no restart
#   cat deploy/edge-knoledgr.conf >> ~/solakuti/deploy/nginx.conf
#   docker compose ... exec -T nginx nginx -t                # validates first
#   docker compose ... exec -T nginx nginx -s reload         # graceful
#
# nginx -t failing leaves the running config untouched, so a bad edit here
# cannot take solakuti down.

# Upgrade passthrough for the Django channels websockets one hop down.
map $http_upgrade $knoledgr_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name knoledgr.com www.knoledgr.com api.knoledgr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.knoledgr.com$request_uri;
    }
}

# www is canonical, matching what production already does: the apex 307s to www
# on Vercel today, so that is what users and search engines have. It is also
# what REACT_APP_API_URL/FRONTEND_URL are built with — if this redirected the
# other way the SPA would load on the apex and then call its own API
# cross-origin at www, through a redirect on every request.
server {
    listen 443 ssl;
    http2 on;
    server_name knoledgr.com;

    ssl_certificate     /etc/letsencrypt/live/knoledgr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knoledgr.com/privkey.pem;

    return 301 https://www.knoledgr.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # api.knoledgr.com is deliberately absent for now: the cutover certificate
    # covers only the apex and www, so answering on that name would serve a
    # mismatched cert. It gets added back by the post-flip webroot re-issue,
    # which can include it for free. Nothing points at it yet — the mobile app
    # still targets Render.
    server_name www.knoledgr.com;

    ssl_certificate     /etc/letsencrypt/live/knoledgr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knoledgr.com/privkey.pem;

    client_max_body_size 60m;

    location / {
        # Resolved at request time through Docker's embedded DNS rather than
        # once at startup. This is what lets the whole Knoledgr stack be torn
        # down and rebuilt without solakuti's nginx caching a dead IP and
        # needing a reload to recover.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $knoledgr_upstream http://knoledgr-web:80;
        proxy_pass $knoledgr_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $knoledgr_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for idle websockets to survive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
