# Knoledgr — this stack's own nginx. Sits behind solakuti's edge nginx, which
# terminates TLS and proxies knoledgr.com here. Serves the SPA and Django
# static, and splits traffic between the WSGI and ASGI upstreams.

# Deliberately no `upstream` blocks. nginx resolves an upstream's hostname once
# at startup and caches that IP for the life of the process, so recreating the
# backend container gives it a new IP nginx never learns about — every request
# then 502s with "connect() failed (111: Connection refused)" until someone
# reloads nginx by hand. Instead each location re-resolves through Docker's
# embedded DNS at request time, the same pattern the edge proxy uses. Costs one
# cached lookup per 10s and buys restart safety.
#
# Variable names avoid the $http_* prefix, which nginx reserves for request
# headers ($http_upstream would read an "Upstream:" header, not our value).

# Websocket upgrade passthrough.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS is terminated one hop up, so $scheme here is always http. Trust the
# edge's X-Forwarded-Proto when present, and fall back to $scheme when the
# stack is reached directly (staging, before the edge is wired up) — otherwise
# Django's SECURE_SSL_REDIRECT would bounce staging requests into a loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    '~.'    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE plus headroom.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # Websockets: /ws/boards/, /ws/notifications/, /ws/agent/runs/ (config/asgi.py).
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_target http://ws:8001;
        proxy_pass $ws_target$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Idle websockets must outlive the default 60s read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Django HTTP surface.
    location ~ ^/(api|admin)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_target http://backend:8000;
        proxy_pass $api_target$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # CRA and Django both publish under /static/ (STATIC_URL is '/static/' and
    # CRA emits static/js|css|media). Rather than move either, serve the SPA
    # bundle first and fall back to Django's collected static — that covers
    # admin, DRF's browsable API and drf-spectacular.
    location /static/ {
        try_files $uri @django_static;
        access_log off;
        expires 30d;
    }

    # CRA filenames are content-hashed, so these are safe to pin hard. Regex
    # locations win over the prefix match above. Django's collected static is
    # unhashed and deliberately not caught here.
    # Quoted because nginx otherwise parses the {8,} repetition braces as block
    # delimiters and refuses to start.
    location ~ "^/static/(js|css|media)/.+\.[0-9a-f]{8,}\..+$" {
        try_files $uri @django_static;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @django_static {
        # /static/foo -> /srv/static/foo
        root /srv;
        access_log off;
        expires 30d;
    }

    # Uploads. New media goes to Cloudinary (settings.py selects
    # MediaCloudinaryStorage when DEBUG is off); this covers anything written
    # to local MEDIA_ROOT.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The shell must never be cached, or clients pin themselves to a stale
    # bundle across deploys. try_files below internally redirects here.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: client-side routes resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
